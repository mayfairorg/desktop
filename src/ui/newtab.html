<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src data:">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Mayfair Search</title>
<link rel="stylesheet" href="ui.css"><link rel="stylesheet" href="start.css">
</head><body>
<main>
  <h1 class="wordmark">Mayfair</h1>
  <form id="f" role="search" autocomplete="off">
    <div class="box" id="box">
      <div class="field-row">
        <span class="lead" id="lead" aria-hidden="true"></span>
        <input id="q" type="text" spellcheck="false" autocapitalize="off" autofocus role="combobox" aria-expanded="false" aria-controls="pop" aria-autocomplete="list" aria-label="Search the web and your Mayfair" placeholder="Search the web and your Mayfair">
        <button type="button" class="clear" id="clear" hidden aria-label="Clear"></button>
      </div>
      <div id="pop" role="listbox" hidden></div>
    </div>
  </form>
  <p class="engine"><span id="engtext">Results from DuckDuckGo</span> <button type="button" id="chg" class="link">Change</button><select id="engsel" hidden aria-label="Search results from"></select></p>
  <nav class="quick" aria-label="Shortcuts" id="quick"></nav>
</main>
<script src="icons.js"></script><script src="answers.js"></script><script src="newtab.js"></script>
</body></html>
