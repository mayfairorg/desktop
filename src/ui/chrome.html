<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src https: http: data:; connect-src 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mayfair Desktop</title>
<link rel="stylesheet" href="ui.css"><link rel="stylesheet" href="chrome.css">
</head><body>
<div id="strip" role="tablist" aria-label="Tabs">
  <div id="tabs"></div>
  <button class="btn" id="newtab" title="New tab (Ctrl+T)" aria-label="New tab"></button>
  <div class="grow"></div>
  <button class="btn" id="menu0" title="Menu" aria-label="Menu"></button>
</div>
<form id="toolbar" autocomplete="off">
  <button type="button" class="btn" id="back" title="Back" aria-label="Back"></button>
  <button type="button" class="btn" id="fwd" title="Forward" aria-label="Forward"></button>
  <button type="button" class="btn" id="reload" title="Reload" aria-label="Reload"></button>
  <div id="omni">
    <button type="button" class="btn" id="site" title="Site information" aria-label="Site information"></button>
    <span id="mode" hidden></span>
    <input id="addr" type="text" spellcheck="false" placeholder="Search or enter address" aria-label="Address bar">
    <button type="button" class="btn" id="zoom" hidden title="Reset zoom"></button>
    <button type="button" class="btn" id="star" title="Bookmark this page (Ctrl+D)" aria-label="Bookmark this page"></button>
  </div>
  <button type="button" class="btn" id="tornew" hidden title="Get a new Tor identity (new circuit, clears this session)">New identity</button>
  <button type="button" class="btn" id="pw" hidden title="Fill from Mayfair Passwords" aria-label="Fill from Mayfair Passwords"></button>
  <button type="button" class="btn" id="shield" title="Blocked trackers" aria-label="Blocked trackers"></button>
  <button type="button" class="btn" id="dl" title="Downloads (Ctrl+J)" aria-label="Downloads"></button>
  <button type="button" class="btn" id="menu" title="Menu" aria-label="Menu"></button>
</form>
<div id="bar" aria-label="Bookmarks"></div>
<script src="icons.js"></script><script src="chrome.js"></script>
</body></html>
